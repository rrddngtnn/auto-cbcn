[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-cbcn"
version = "0.1.0"
description = "Universal CodeBuddy China (CBCN / copilot.tencent.com) automated registration, Tencent slider solver, BYOP SMS adapters, daily drip cron, and composable CredentialBundle sinks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rrddngtnn", email = "109033763+rrddngtnn@users.noreply.github.com"}
]
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
browser = ["camoufox>=0.4", "playwright>=1.48"]
dev = ["pytest>=8"]

[project.scripts]
auto-cbcn = "auto_cbcn.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
